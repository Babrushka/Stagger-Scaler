name: Generate GitHub Release Asset

on:
  push:
    tags:
      - 'v*' # Automatically triggers when you push a tag version like v1.0.1

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        ref: master # FIX: Explicitly forces the checker to read from your master branch layout

    - name: Setup .NET SDK Compiler
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Restore Project NuGet Dependencies
      run: dotnet restore

    - name: Compile Stagger Scaler Binary
      run: dotnet build --configuration Release

    - name: Bundle Archive Staging Canvas
      run: |
        mkdir -p staging_dir
        # Fixed Copy: Pulls the library directly and renames it to StaggerScaler.dll flatly
        cp bin/Release/net462/DynamicParryScaling.dll staging_dir/StaggerScaler.dll
        cp readme.md staging_dir/README.md
        
        # Zip up the compiled binary along with the readme file
        cd staging_dir && zip -r ../StaggerScaler_${{ github.ref_name }}.zip .

    - name: Generate Production Release Page and Attach Zip
      uses: softprops/action-gh-release@v2
      with:
        files: StaggerScaler_${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
